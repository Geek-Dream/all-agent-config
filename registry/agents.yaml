# =============================================================================
# All Agent Config —— Agent 工具注册表
#
# 每个工具声明：如何检测、如何安装、配置/会话数据在哪里。
# 新增工具只需在本文档追加条目，无需改代码。
#
# sources 支持三种安装源：
#   npm:    npm 包名（支持 用户级/全局 两种安装范围，见 installer.py）
#   brew:   macOS Homebrew formula（暂不支持 Windows，标 TODO）
#   manual: 无自动安装源，页面会提示用户手动安装并给出说明
#
# config_dirs / session_dirs 用于 M2 的配置导出/导入与对话迁移功能。
#
# 路径支持三种写法：~（用户目录）、$VAR/${VAR}、Windows %VAR%（如 %APPDATA%）。
# XDG 风格工具（~/.config/xxx）建议同时给出 Windows 候选路径——扫描时
# 不存在的路径会自动跳过，多个候选互不影响。
# =============================================================================

agents:
  - id: claude-code
    name: Claude Code
    vendor: Anthropic
    homepage: "https://www.anthropic.com/claude-code"
    command: claude
    version_cmd: claude --version
    sources:
      npm: "@anthropic-ai/claude-code"
    config_dirs: ["~/.claude"]
    session_dirs: ["~/.claude/projects"]
    categories:
      system:
        - "~/.claude/settings.json"
        - "~/.claude/keybindings.json"
        - "~/.claude/ide.json"
      hooks:
        - path: "~/.claude/settings.json"
          json_keys: ["hooks"]
      skills: ["~/.claude/skills"]
      mcp:
        - path: "~/.claude.json"
          json_keys: ["mcpServers"]
      theme: []
      custom:
        - "~/.claude/CLAUDE.md"
        - "~/.claude/statusline.sh"
        - "~/.claude/agents"
        - "~/.claude/commands"
        - "~/.claude/hooks"
        - "~/.claude/rules"
    notes: 配置含 settings.json / CLAUDE.md / skills / plugins / hooks / statusline（状态栏自定义）

  - id: codex
    name: Codex CLI
    vendor: OpenAI
    homepage: "https://openai.com/codex/"
    command: codex
    version_cmd: codex --version
    sources:
      npm: "@openai/codex"
    config_dirs: ["~/.codex"]
    session_dirs: ["~/.codex/sessions"]
    categories:
      system: ["~/.codex/config.toml"]
      mcp:
        - path: "~/.codex/config.toml"
          toml_keys: ["mcp_servers"]
      hooks:
        - path: "~/.codex/hooks.json"
          json_keys: ["hooks"]
      skills: ["~/.codex/skills"]
      custom: ["~/.codex/AGENTS.md", "~/.codex/prompts"]
    notes: 配置含 config.toml / auth / skills / agents.md

  - id: pi
    name: Pi
    vendor: Mario Zechner
    homepage: "https://github.com/badlogic/pi-mono"
    command: pi
    version_cmd: pi --version
    sources:
      npm: "@earendil-works/pi-coding-agent"   # 原 @mariozechner/pi-coding-agent，已迁移组织
    config_dirs: ["~/.pi"]
    session_dirs: ["~/.pi/agent/sessions"]
    categories:
      system:
        - "~/.pi/agent/settings.json"
        - "~/.pi/agent/models.json"
      theme:
        - path: "~/.pi/agent/settings.json"
          json_keys: ["theme", "themes"]
      skills: ["~/.pi/agent/skills", "~/.pi/pi-extensions/skills"]
      custom:
        - "~/.pi/agent/statusline-pi.json"
        - "~/.pi/agent/wl-setup.json"
        - "~/.pi/agent/themes"
        - "~/.pi/SYSTEM.md"
        - "~/.pi/APPEND_SYSTEM.md"
        - "~/.pi/agent/extensions"
        - "~/.pi/pi-extensions"
    notes: 配置实际位于 ~/.pi/agent/；进度条/标题栏魔改在 agent/extensions 或程序包内（后者由补丁检测发现）

  - id: gemini-cli
    name: Gemini CLI
    vendor: Google
    homepage: "https://github.com/google-gemini/gemini-cli"
    command: gemini
    version_cmd: gemini --version
    sources:
      npm: "@google/gemini-cli"
    config_dirs: ["~/.gemini"]
    session_dirs: []
    categories:
      system: ["~/.gemini/settings.json"]
      mcp:
        - path: "~/.gemini/settings.json"
          json_keys: ["mcpServers"]
      custom: ["~/.gemini/GEMINI.md"]
    notes: 配置含 settings.json / GEMINI.md / extensions

  - id: qwen-code
    name: Qwen Code
    vendor: Alibaba
    homepage: "https://github.com/QwenLM/qwen-code"
    command: qwen
    version_cmd: qwen --version
    sources:
      npm: "@qwen-code/qwen-code"
    config_dirs: ["~/.qwen"]
    session_dirs: []
    categories:
      system: ["~/.qwen/settings.json"]
      mcp:
        - path: "~/.qwen/settings.json"
          json_keys: ["mcpServers"]
      custom: ["~/.qwen/QWEN.md"]
    notes: Gemini CLI 的 fork，配置结构与 gemini 类似

  - id: opencode
    name: OpenCode
    vendor: SST / anomaly
    homepage: "https://opencode.ai"
    command: opencode
    version_cmd: opencode --version
    sources:
      npm: "opencode-ai"
    bin_paths: ["~/.opencode/bin"]      # 官方脚本默认装到 ~/.opencode/bin
    config_dirs: ["~/.config/opencode", "~/.local/share/opencode",
                  "%APPDATA%/opencode", "%LOCALAPPDATA%/opencode"]
    session_dirs: ["~/.local/share/opencode/storage", "%LOCALAPPDATA%/opencode/storage"]
    categories:
      system:
        - path: "~/.config/opencode/opencode.json"
          json_keys: ["$schema", "theme", "model", "small_model", "autoshare", "disabled_providers", "plugin", "watcher"]
        - path: "%APPDATA%/opencode/opencode.json"
          json_keys: ["$schema", "theme", "model", "small_model", "autoshare", "disabled_providers", "plugin", "watcher"]
      mcp:
        - path: "~/.config/opencode/opencode.json"
          json_keys: ["mcp"]
        - path: "%APPDATA%/opencode/opencode.json"
          json_keys: ["mcp"]
      custom:
        - "~/.config/opencode/agent"
        - "~/.config/opencode/commands"
        - "%APPDATA%/opencode/agent"
        - "%APPDATA%/opencode/commands"
    notes: 也可用官方脚本 opencode.ai/install 安装

  - id: kimi-code
    name: Kimi Code
    vendor: Moonshot AI
    homepage: "https://code.kimi.com"
    command: kimi
    version_cmd: kimi --version
    bin_paths: ["~/.kimi-code/bin"]        # 独立二进制，不经 npm，也不在 PATH
    managed_files: ["bin", "cache", "updates"]   # 卸载时只删程序文件，保留配置/会话/skills（内置自动更新，不提供更新按钮）
    sources:
      manual: "官方脚本安装到 ~/.kimi-code（独立二进制，内置自动更新）"
    config_dirs: ["~/.kimi-code"]
    session_dirs: ["~/.kimi-code/sessions"]
    categories:
      system:
        - "~/.kimi-code/config.toml"
        - "~/.kimi-code/tui.toml"
      skills: ["~/.kimi-code/skills"]
      custom:
        - "~/.kimi-code/workspaces.json"
        - "~/.kimi-code/workspace-trust"
    notes: 独立二进制版（~/.kimi-code），内置自动更新；credentials / oauth 凭据不纳入导出

  - id: crush
    name: Crush
    vendor: Charmbracelet
