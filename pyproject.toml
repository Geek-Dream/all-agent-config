[project]
name = "all-agent-config"
version = "0.2.0"
description = "AI Agent 装机与配置迁移中心 —— 一键安装/更新/备份/迁移你的所有 Agent TUI 工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[project.scripts]
aac = "app.main:cli"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*", "agents.yaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
