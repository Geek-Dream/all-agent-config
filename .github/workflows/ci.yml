name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pyyaml python-multipart cryptography

      - name: Compile
        run: python -m compileall -q app tests

      - name: Registry smoke
        run: python -c "from app import registry; print(len(registry.load_agents()))"

      - name: Test
        run: python -m unittest discover -s tests -v
