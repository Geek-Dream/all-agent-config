# =============================================================================
# All Agent Config —— Agent 工具注册表
#
# 每个工具声明：如何检测、如何安装、配置/会话数据在哪里。
# 新增工具只需在本文档追加条目，无需改代码。
#
# sources 支持的安装源：
#   npm:      npm 包名（支持 用户级/全局 两种安装范围，见 installer.py）
#   brew:     macOS Homebrew formula（暂不支持 Windows，标 TODO）
#   manual:   无自动安装源，页面会提示用户手动安装并给出说明
#   download: 官方直链，按平台键（macos-arm64 / macos-x64 / windows-x64 / any）
#   github:   GitHub Release（repo + asset glob，可选 mirror / prerelease / archive 源码 zip）
#
# desktop: 桌面程序路径（macos / windows），用于检测与「启动」按钮。
#
# config_dirs / session_dirs 用于 M2 的配置导出/导入与对话迁移功能。
#
# 路径支持三种写法：~（用户目录）、$VAR/${VAR}、Windows %VAR%（如 %APPDATA%）。
# XDG 风格工具（~/.config/xxx）建议同时给出 Windows 候选路径——扫描时
# 不存在的路径会自动跳过，多个候选互不影响。
# =============================================================================

agents:
  - id: claude-code
    name: Claude Code
    vendor: Anthropic
    homepage: "https://www.anthropic.com/claude-code"
    command: claude
    version_cmd: claude --version
    sources:
      npm: "@anthropic-ai/claude-code"
    config_dirs: ["~/.claude"]
    session_dirs: ["~/.claude/projects"]
    provider:
      adapter: claude-env
      mode: switch
      target: "~/.claude/settings.json"
    categories:
      system:
        - "~/.claude/settings.json"
        - "~/.claude/keybindings.json"
        - "~/.claude/ide.json"
      hooks:
        - path: "~/.claude/settings.json"
          json_keys: ["hooks"]
      skills: ["~/.claude/skills"]
      mcp:
        - path: "~/.claude.json"
          json_keys: ["mcpServers"]
      theme: []
      custom:
        - "~/.claude/CLAUDE.md"
        - "~/.claude/statusline.sh"
        - "~/.claude/agents"
        - "~/.claude/commands"
        - "~/.claude/hooks"
        - "~/.claude/rules"
    launch:
      needs_terminal: true
      resume_args: ["--continue"]
      modes:
        normal: {name: 普通模式, args: []}
        review: {name: 审核模式, args: ["--permission-mode", "plan"]}
        sandbox: {name: 沙箱模式, args: ["--settings", '{"sandbox":{"enabled":true}}'], note: "依赖 Claude Code 内置沙箱支持"}
        danger: {name: 危险模式, args: ["--dangerously-skip-permissions"], confirm: true, warning: "跳过全部权限确认，可任意读写文件并执行命令"}
    i18n:
      kind: binary
      map: claude.json
      auto: true
      locate:
        package: "@anthropic-ai/claude-code"
        glob: "bin/claude*"
    notes: 配置含 settings.json / CLAUDE.md / skills / plugins / hooks / statusline（状态栏自定义）；汉化为二进制等字节补丁（升级后自动重打）

  - id: codex
    name: Codex CLI
    vendor: OpenAI
    homepage: "https://openai.com/codex/"
    command: codex
    version_cmd: codex --version
    sources:
      npm: "@openai/codex"
    config_dirs: ["~/.codex"]
    session_dirs: ["~/.codex/sessions"]
    provider:
      adapter: codex-toml
      mode: switch
      target: "~/.codex/config.toml"
    categories:
      system: ["~/.codex/config.toml"]
      mcp:
        - path: "~/.codex/config.toml"
          toml_keys: ["mcp_servers"]
      hooks:
        - path: "~/.codex/hooks.json"
          json_keys: ["hooks"]
      skills: ["~/.codex/skills"]
      custom: ["~/.codex/AGENTS.md", "~/.codex/prompts"]
    launch:
      needs_terminal: true
      resume_args: ["resume", "--last"]
      modes:
        normal: {name: 普通模式, args: []}
        review: {name: 审核模式, args: ["-s", "read-only"]}
        sandbox: {name: 沙箱模式, args: ["-s", "workspace-write", "-a", "on-request"]}
        danger: {name: 危险模式, args: ["--dangerously-bypass-approvals-and-sandbox"], confirm: true, warning: "跳过全部权限确认，可任意读写文件并执行命令"}
    i18n:
      kind: binary
      map: codex.json
      auto: true
      locate:
        package: "@openai/codex"
        glob: "node_modules/@openai/codex-*/vendor/*/bin/codex*"
    notes: 配置含 config.toml / auth / skills / agents.md；汉化为二进制等字节补丁（升级后自动重打）

  - id: pi
    name: Pi
    vendor: Mario Zechner
    homepage: "https://github.com/badlogic/pi-mono"
    command: pi
    version_cmd: pi --version
    sources:
      npm: "@earendil-works/pi-coding-agent"   # 原 @mariozechner/pi-coding-agent，已迁移组织
    config_dirs: ["~/.pi"]
    session_dirs: ["~/.pi/agent/sessions"]
    provider:
      adapter: pi-json
      mode: switch
      target: "~/.pi/agent/settings.json"     # defaultProvider / defaultModel
      models: "~/.pi/agent/models.json"       # providers.<id>.{baseUrl,api,apiKey,models}
    categories:
      system:
        - "~/.pi/agent/settings.json"
        - "~/.pi/agent/models.json"
      theme:
        - path: "~/.pi/agent/settings.json"
          json_keys: ["theme", "themes"]
      skills: ["~/.pi/agent/skills", "~/.pi/pi-extensions/skills"]
      custom:
        - "~/.pi/agent/statusline-pi.json"
        - "~/.pi/agent/wl-setup.json"
        - "~/.pi/agent/pi-fusion-preferences"
        - "~/.pi/agent/themes"
        - "~/.pi/SYSTEM.md"
        - "~/.pi/APPEND_SYSTEM.md"
        - "~/.pi/agent/extensions"
        - "~/.pi/pi-extensions"
    launch:
      needs_terminal: true
      resume_args: ["--continue"]
      modes:
        normal: {name: 普通模式, args: []}
        review: {name: 审核模式, args: ["--no-tools"], note: "禁用全部工具，只能对话"}
        sandbox: {name: 沙箱模式, args: [], supported: false, reason: "Pi 无内置沙箱"}
        danger: {name: 危险模式, args: [], supported: false, reason: "Pi 默认无权限审批，无额外开关"}
    i18n:
      kind: text
      map: pi.json
      auto: true
      marker: "Open settings menu"
      locate:
        package: "@earendil-works/pi-coding-agent"
        glob: "dist/**/*.js"
    notes: 配置实际位于 ~/.pi/agent/；进度条/标题栏魔改在 agent/extensions 或程序包内（后者由补丁检测发现）

